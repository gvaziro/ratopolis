# Balance (REP-1): the slow tests and the headless balance sim, nightly and on pull requests that touch the game
# data or the engine. Seed 12345 runs with --strict (any GDD checkpoint FAIL turns the job red); seed 777 reports only.
# The seed matrix against scripts/balance-baseline.json is informational until the baseline settles (ENG-2, ENG-13).
name: Balance

on:
  schedule:
    - cron: "37 2 * * *" # nightly, 02:37 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "src/game/data/**"
      - "src/game/engine/**"
      - "scripts/sim-*.ts"
      - "scripts/balance-*"

permissions:
  contents: read

concurrency:
  group: balance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  slow-tests:
    name: Slow tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # *.slow.test.ts: the 3-hour reachability run, clone and headline marathons
      - run: npm run test:slow

  sim:
    name: Sim, seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 12345
            strict: true
          - seed: 777
            strict: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Balance sim (3 runs, both bots)
        shell: bash
        run: |
          set -o pipefail
          args=(--seed "${{ matrix.seed }}" --runs 3 --quiet --summary)
          if [ "${{ matrix.strict }}" = "true" ]; then args+=(--strict); fi
          npm run --silent sim -- "${args[@]}" 2>&1 | tee "sim-${{ matrix.seed }}.log"

      - name: Publish the SUMMARY
        if: always()
        shell: bash
        run: node .github/scripts/sim-summary.mjs "sim-${{ matrix.seed }}.log" "${{ matrix.seed }}" "sim-${{ matrix.seed }}.summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the sim output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-seed-${{ matrix.seed }}
          path: |
            sim-${{ matrix.seed }}.log
            sim-${{ matrix.seed }}.summary.json
          retention-days: 30
          if-no-files-found: warn

  matrix:
    name: Seed matrix vs baseline (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: sim:matrix
        shell: bash
        run: |
          set -o pipefail
          base=()
          if [ -f scripts/balance-baseline.json ]; then
            base=(--baseline scripts/balance-baseline.json)
          else
            echo "::notice title=Balance baseline::scripts/balance-baseline.json is not committed yet (npm run sim:baseline); running without a diff."
          fi
          npm run --silent sim:matrix -- "${base[@]}" 2>&1 | tee sim-matrix.log

      - name: Publish the matrix
        if: always()
        shell: bash
        run: |
          {
            echo "### Seed matrix"
            echo
            echo '```text'
            cat sim-matrix.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the matrix output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-matrix
          path: sim-matrix.log
          retention-days: 30
          if-no-files-found: warn
